<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baskervville:ital@0;1&display=swap" rel="stylesheet">
  <title>{{ work }}</title>
  <style>
    html, body {
      height: 100vh;
      width: 100vw;
      margin: 0;
      background-color: #21222d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4vh 5vw;
      box-sizing: border-box;
      overflow: hidden;
    }

    img {
      max-width: 100%;
      max-height: 88vh;
      object-fit: contain;
    }

    .caption {
      font-family: "Baskervville", serif;
      color: #fff6ec;
      font-size: 1.3rem;
      font-style: italic;
      margin-top: 1.25rem;
      text-align: center;
    }

    .meta {
      font-family: "Baskervville", serif;
      color: #7a7870;
      font-size: 1rem;
      margin-top: 0.4rem;
      text-align: center;
    }
  </style>
</head>

<body>
  <img src="/static/artwork/{{ filename }}" alt="{{ work }}">
  <div class="caption">{{ work }}</div>
  <div class="meta">{{ artist }}, {{ date }}</div>

  <script>
    document.addEventListener('keydown', e => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'q')           location.href = '/admin';
      if (e.key === 'ArrowRight')  location.href = '/qotd';
      if (e.key === 'ArrowLeft')   location.href = '/wotd';
    });
  </script>
</body>

</html>
